<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning hub</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=20261122-3">
<script src="assets/common.js?v=20261122-3"></script>
<script src="assets/data.js?v=20261122-3"></script>
</head>
<body>
  <header class="site-header narrow">
    <div class="inner">
      <a class="brand" href="index.html">
        <span class="brand-mark"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><circle class="lg-s" cx="24" cy="25" r="22"/><circle class="lg-i" cx="24" cy="5.5" r="1.6"/><rect class="lg-i" x="23.1" y="6" width="1.8" height="5"/><path class="lg-i" d="M8 17.5C14 17.5 18 14.5 20 10.5H28C30 14.5 34 17.5 40 17.5C36 19 32.5 19 30 18.6H18C15.5 19 12 19 8 17.5Z"/><rect class="lg-i" x="18.5" y="19.6" width="11" height="4.6"/><path class="lg-i" d="M4.5 29.5C11 29.5 15 26.5 17 23H31C33 26.5 37 29.5 43.5 29.5C39.5 31 35.5 31 33 30.6H15C12.5 31 8.5 31 4.5 29.5Z"/><rect class="lg-i" x="15" y="31.6" width="18" height="7.6"/><path class="lg-g" d="M21.6 39.2V35.6a2.4 2.4 0 0 1 4.8 0V39.2Z"/><rect class="lg-i" x="11" y="39.2" width="26" height="2.6" rx="1"/></svg></span>
        Learning hub
      </a>
      <button type="button" class="icon-btn" data-theme-toggle></button>
    </div>
  </header>

  <main class="portal">
    <div class="greet">
      <h1 id="greeting">Chào bạn</h1>
      <p id="greet-sub"></p>
    </div>

    <section class="stats-row" aria-label="Thời gian học">
      <div class="panel goal">
        <div class="panel-head"><strong>Mục tiêu mỗi ngày</strong><span id="goal-label"></span></div>
        <div class="goal-now"><b id="today-time">0p</b><span id="today-of"></span></div>
        <div class="progress"><span id="today-bar" style="width:0%"></span></div>
        <div class="goal-stats">
          <div><b id="streak">0</b><span>ngày liên tiếp đạt mục tiêu</span></div>
          <div><b id="goal30">0/30</b><span>ngày đạt trong 30 ngày qua</span></div>
          <div><b id="month-hours">0g</b><span id="month-label">đã học trong tháng này</span></div>
        </div>
        <div class="goal-edit">
          <label for="today-edit">Hôm nay đã học</label>
          <input type="number" id="today-edit" min="0" max="1440" step="5" inputmode="numeric" placeholder="0">
          <span>phút</span>
          <button type="button" id="today-save">Lưu</button>
        </div>
        <p class="goal-note">Tự đếm khi đang mở bài học. Sửa số trên nếu học thêm ngoài site. Lưu trên trình duyệt này.</p>
      </div>

      <div class="panel heat">
        <div class="panel-head">
          <strong id="heat-title">Lịch học</strong>
          <div class="seg" role="group" aria-label="Khoảng thời gian">
            <button type="button" data-range="week">Tuần</button>
            <button type="button" data-range="month">Tháng</button>
            <button type="button" data-range="6m">6 tháng</button>
          </div>
        </div>
        <div class="heat-summary" id="heat-summary"></div>
        <div id="heat-view" role="img" aria-label="Biểu đồ nhiệt thời gian học theo ngày"></div>
        <div class="heat-legend" aria-hidden="true">
          <span>0g</span><i></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i><span>3g+</span>
          <span style="margin-left:12px;display:flex;align-items:center;gap:5px"><i style="background:transparent;box-shadow:inset 0 0 0 1.5px var(--text)"></i>hôm nay</span>
        </div>
      </div>
    </section>

    <div class="section-head">
      <div>
        <h2>Topic</h2>
        <p id="topic-count"></p>
      </div>
      <label class="field">
        <span id="search-icon"></span>
        <span class="sr-only">Tìm topic</span>
        <input type="search" id="search" placeholder="Tìm topic…" autocomplete="off">
      </label>
    </div>

    <div class="topic-grid" id="topics"></div>
    <div class="empty" id="empty" hidden>Không có topic nào khớp.</div>
  </main>

  <footer class="site-footer"><div class="inner" id="footer">Learning hub</div></footer>

  <script src="assets/portal.js?v=20261122-3"></script>
</body>
</html>
